version: '3.8'

services:
  backend:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}

  frontend:
    build: ./ui
    ports:
      - "5173:5173"
    volumes:
      - ./ui/src:/app/src
    environment:
      - VITE_API_BASE=http://localhost:8000/api
    depends_on:
      - backend